<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ site.title }}{% if page.target_date %} · {{ page.target_date }}{% endif %}</title>
    <meta name="description" content="{{ page.summary | default: site.description | strip_html | escape }}">
    <meta name="theme-color" content="#e53935">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/v2ex-hot-icon.svg' | relative_url }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/favicon-32x32.png' | relative_url }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/favicon-16x16.png' | relative_url }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
    <style>
      :root {
        color-scheme: light;
        --bg: #fdfdfd;
        --ink: #171717;
        --muted: #737373;
        --soft: #f5f5f5;
        --line: #e5e5e5;
        --accent: #d92d20;
        --accent-soft: #fff6f5;
        --accent-line: #efaaa4;
        --danger: #b42318;
        --content-width: 800px;
        --shell-width: 1060px;
      }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 17px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        text-rendering: optimizeLegibility;
      }
      a {
        color: var(--accent);
        text-decoration: none;
        text-underline-offset: 3px;
      }
      a:hover { text-decoration: underline; }
      .site-header { border-bottom: 1px solid var(--line); }
      .site-header-inner,
      .page-shell {
        width: min(calc(100% - 40px), var(--shell-width));
        margin: 0 auto;
      }
      .site-header-inner {
        min-height: 54px;
        display: flex;
        align-items: center;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        color: var(--ink);
        font-size: 15px;
        font-weight: 720;
        letter-spacing: .01em;
      }
      .brand-mark {
        width: 26px;
        height: 26px;
        flex: 0 0 auto;
        border-radius: 6px;
      }
      .page-shell {
        display: grid;
        grid-template-columns: minmax(0, var(--content-width)) 180px;
        align-items: start;
        gap: 64px;
        padding: 36px 0 56px;
      }
      .content-column { min-width: 0; }
      .report-header { margin-bottom: 24px; }
      .kicker {
        margin: 0;
        color: var(--ink);
        font-size: 28px;
        font-weight: 700;
        line-height: 1.35;
        letter-spacing: -.025em;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }
      .blocked-note {
        margin: 22px 0 0;
        padding: 12px 14px;
        border-left: 3px solid var(--danger);
        background: #fef2f2;
        color: var(--danger);
        font-size: 14px;
      }
      .report { min-width: 0; }
      .report > h1:first-of-type { display: none; }
      .status-success .report > blockquote:first-child { display: none; }
      .report h2 {
        margin: 64px 0 22px;
        padding-top: 23px;
        border-top: 1px solid var(--line);
        font-size: 28px;
        line-height: 1.3;
        letter-spacing: -.02em;
      }
      .report h2:first-of-type {
        margin-top: 0;
        padding-top: 0;
        border-top: 0;
      }
      .report p { margin: 0 0 18px; }
      .report ul,
      .report ol {
        margin: 0 0 22px;
        padding-left: 1.35em;
      }
      .report li { margin: 7px 0; }
      .report p,
      .report li,
      .report a {
        overflow-wrap: anywhere;
        word-break: break-word;
      }
      .report blockquote {
        margin: 0 0 26px;
        padding: 12px 16px;
        border-left: 3px solid var(--accent);
        background: var(--soft);
        color: #525252;
      }
      .report blockquote p:last-child { margin-bottom: 0; }
      .report code {
        padding: 2px 5px;
        border-radius: 4px;
        background: var(--soft);
        font-size: .9em;
      }
      .report hr {
        margin: 56px 0;
        border: 0;
        border-top: 1px solid var(--line);
      }
      .topic-card {
        margin: 0;
        border-top: 1px solid var(--line);
      }
      .topic-card:last-of-type { border-bottom: 1px solid var(--line); }
      .topic-card > summary {
        display: flex;
        align-items: baseline;
        gap: 12px;
        padding: 15px 0;
        cursor: pointer;
        list-style: none;
      }
      .topic-card > summary::-webkit-details-marker { display: none; }
      .topic-card > summary:hover .topic-title { color: var(--accent); }
      .topic-card[open] > summary { padding-bottom: 10px; }
      .topic-card > summary::after {
        width: 9px;
        height: 9px;
        flex: 0 0 auto;
        align-self: center;
        margin: 0 4px 0 auto;
        border-right: 2px solid var(--accent);
        border-bottom: 2px solid var(--accent);
        content: "";
        opacity: 0;
        transform: translateY(-2px) rotate(45deg);
        transform-origin: center;
      }
      .topic-card > summary:has(.topic-title:hover)::after,
      .topic-card > summary:focus-visible::after,
      .topic-card[open] > summary::after { opacity: 1; }
      .topic-card[open] > summary::after {
        transform: translateY(2px) rotate(225deg);
      }
      .topic-rank {
        min-width: 2.2em;
        color: #a3a3a3;
        font: 650 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        font-variant-numeric: tabular-nums;
      }
      .topic-title {
        min-width: 0;
        flex: 1;
        color: var(--ink);
        font-size: 19px;
        font-weight: 720;
        line-height: 1.45;
        letter-spacing: -.01em;
        transition: color .15s ease;
      }
      .topic-card.is-read .topic-title {
        color: #8a8a8a;
        font-weight: 620;
      }
      .topic-card.is-read > summary:hover .topic-title { color: #737373; }
      .topic-card > p,
      .topic-card > ul,
      .topic-card > ol,
      .topic-card > .analysis-evidence {
        margin-left: 3.1em;
        margin-right: 38px;
      }
      .topic-card > p:first-of-type { font-size: 14px; }
      .topic-content {
        position: relative;
        margin-bottom: 24px;
        padding: 14px 0 0 42px;
      }
      .topic-content::before {
        position: absolute;
        top: 14px;
        bottom: 0;
        left: 0;
        width: 3px;
        border-radius: 999px;
        background: linear-gradient(180deg, var(--accent), var(--accent-line));
        content: "";
      }
      .topic-article {
        margin: 0;
        padding: 16px 0 4px;
        background: transparent;
        color: #303030;
      }
      .topic-article h3 {
        position: relative;
        margin: 22px 0 8px;
        color: var(--ink);
        font-size: 17px;
        line-height: 1.45;
        letter-spacing: -.01em;
      }
      .topic-article h3:first-child { margin-top: 2px; }
      .topic-article p { margin-bottom: 12px; }
      .topic-article ul {
        margin: 0 0 14px;
        padding-left: 0;
        list-style: none;
      }
      .topic-article ul li {
        position: relative;
        padding-left: 18px;
      }
      .topic-article ul li::before {
        position: absolute;
        top: .86em;
        left: 2px;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--accent);
        content: "";
        transform: translateY(-50%);
      }
      .topic-article ol {
        margin: 0 0 14px;
        padding-left: 1.3em;
      }
      .topic-article li { margin: 4px 0; }
      .topic-article blockquote {
        margin: 12px 0 18px;
        padding: 8px 13px;
        border-left-width: 2px;
        font-size: 15px;
      }
      .topic-article pre {
        margin: 12px 0 18px;
        padding: 13px 15px;
        overflow-x: auto;
        border-radius: 7px;
        background: var(--soft);
        font-size: 14px;
        line-height: 1.6;
      }
      .topic-article > :last-child { margin-bottom: 0; }
      .topic-article a {
        text-decoration: underline;
        text-decoration-color: var(--accent-line);
        text-decoration-thickness: 1px;
      }
      .topic-source {
        margin: 0;
        padding: 0 0 10px;
        border-bottom: 1px solid var(--line);
        background: transparent;
        color: var(--muted);
        font-size: 14px;
      }
      .topic-source a {
        color: #a82a21;
        text-decoration-color: transparent;
        transition: color .15s ease, text-decoration-color .15s ease;
      }
      .topic-source a:hover {
        color: var(--accent);
        text-decoration-color: currentColor;
      }
      @keyframes topic-content-reveal {
        from {
          opacity: 0;
          transform: translateY(-5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        .topic-card > summary::after {
          transition: opacity 140ms ease, transform 220ms cubic-bezier(.2, .7, .2, 1);
        }
        .topic-card[open] > .topic-content {
          animation: topic-content-reveal 180ms cubic-bezier(.2, .7, .2, 1) both;
        }
      }
      .analysis-evidence {
        margin: 18px 0 34px;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--soft);
        color: #525252;
        font-size: 14px;
      }
      .analysis-evidence summary {
        cursor: pointer;
        color: var(--muted);
        font-weight: 650;
      }
      .analysis-evidence[open] summary { margin-bottom: 10px; }
      .analysis-evidence p:last-child { margin-bottom: 0; }
      .date-sidebar {
        position: sticky;
        top: 26px;
        max-height: calc(100vh - 52px);
        overflow: auto;
        scrollbar-width: thin;
      }
      .date-sidebar h2 {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 650;
        letter-spacing: .08em;
      }
      .date-list { display: grid; gap: 2px; }
      .date-link {
        display: block;
        padding: 4px 9px;
        border-radius: 6px;
        color: var(--muted);
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }
      .date-link:hover {
        background: var(--soft);
        color: var(--ink);
        text-decoration: none;
      }
      .date-link.is-current {
        background: var(--soft);
        color: var(--ink);
        font-weight: 700;
      }
      .mobile-date-jump { display: none; }
      @media (max-width: 980px) {
        .site-header-inner,
        .page-shell { width: min(calc(100% - 40px), var(--content-width)); }
        .page-shell { display: block; }
        .date-sidebar { display: none; }
        .mobile-date-jump {
          display: flex;
          align-items: center;
          gap: 10px;
          margin-bottom: 20px;
          color: var(--muted);
          font-size: 13px;
        }
        .mobile-date-jump select {
          min-width: 0;
          min-height: 44px;
          max-width: 190px;
          padding: 9px 30px 9px 10px;
          border: 1px solid var(--line);
          border-radius: 7px;
          background: var(--bg);
          color: var(--ink);
          font: inherit;
        }
      }
      @media (max-width: 640px) {
        body { font-size: 16px; line-height: 1.68; }
        .site-header-inner,
        .page-shell { width: min(calc(100% - 32px), var(--content-width)); }
        .site-header-inner { min-height: 50px; }
        .page-shell { padding: 24px 0 44px; }
        .mobile-date-jump { margin-bottom: 18px; }
        .report-header { margin-bottom: 20px; }
        .kicker { font-size: 23px; }
        .report h2 { margin-top: 48px; font-size: 24px; }
        .topic-card > summary { min-height: 52px; align-items: baseline; gap: 8px; padding: 13px 0; }
        .topic-card[open] > summary { padding-bottom: 10px; }
        .topic-rank { min-width: 1.9em; }
        .topic-title { font-size: 17px; line-height: 1.45; }
        .topic-card > p,
        .topic-card > ul,
        .topic-card > ol,
        .topic-card > .analysis-evidence { margin-left: 0; margin-right: 0; }
        .topic-content { padding-left: 30px; }
        .topic-article { padding: 15px 0 3px; }
        .topic-source { padding-bottom: 10px; }
      }
    </style>
  </head>
  <body class="status-{{ page.status | default: 'success' }}">
    <header class="site-header">
      <div class="site-header-inner">
        <a class="brand" href="{{ '/' | relative_url }}">
          <img class="brand-mark" src="{{ '/assets/v2ex-hot-icon.svg' | relative_url }}" width="26" height="26" alt="">
          <span>V2EX 每日热点</span>
        </a>
      </div>
    </header>

    <main class="page-shell">
      <div class="content-column">
        <div class="mobile-date-jump">
          <label for="report-date-select">切换日期</label>
          <select id="report-date-select" aria-label="选择日期">
            {% for post in site.posts %}
              <option value="{{ post.url | relative_url }}"{% if post.target_date == page.target_date %} selected{% endif %}>{{ post.target_date | default: post.date | date: "%Y-%m-%d" }}</option>
            {% endfor %}
          </select>
        </div>

        <header class="report-header">
          <h1 class="kicker"><time datetime="{{ page.target_date }}">{{ page.target_date | date: "%Y年%m月%d日" }}</time>热点内容</h1>
          {% if page.status == 'blocked' %}
            <p class="blocked-note">本期报告生成受阻，正文保留诊断信息供排查。</p>
          {% endif %}
        </header>

        <article class="report">
          {{ content }}
        </article>
      </div>

      <aside class="date-sidebar" aria-label="往期热点">
        <h2>往期热点</h2>
        <nav class="date-list" aria-label="日期列表">
        {% for post in site.posts %}
          <a class="date-link{% if post.target_date == page.target_date %} is-current{% endif %}" href="{{ post.url | relative_url }}"{% if post.target_date == page.target_date %} aria-current="page"{% endif %}>{{ post.target_date | default: post.date | date: "%Y-%m-%d" }}</a>
        {% endfor %}
        </nav>
      </aside>
    </main>

    <script>
      (() => {
        const select = document.getElementById('report-date-select');
        select?.addEventListener('change', () => {
          if (select.value) window.location.href = select.value;
        });

        // Older generated reports may still contain this now-retired section.
        const report = document.querySelector('.report');
        const retiredHighlights = Array.from(report?.querySelectorAll('h2') || [])
          .find((item) => item.textContent.trim() === '值得读的内容');
        if (retiredHighlights) {
          let sibling = retiredHighlights.nextElementSibling;
          while (sibling && !sibling.matches('.topic-card')) {
            const next = sibling.nextElementSibling;
            sibling.remove();
            sibling = next;
          }
          retiredHighlights.remove();
        }

        const heading = Array.from(report?.querySelectorAll('h2') || [])
          .find((item) => item.textContent.trim() === '报告说明');
        if (heading) {
          let sibling = heading.nextElementSibling;
          while (sibling && sibling.tagName !== 'H2') {
            const next = sibling.nextElementSibling;
            sibling.remove();
            sibling = next;
          }
          heading.remove();
        }

        document.querySelectorAll('.topic-source').forEach((source) => {
          const article = source.previousElementSibling;
          if (article?.classList.contains('topic-article')) {
            source.parentElement.insertBefore(source, article);
          }
          const followingArticle = source.nextElementSibling;
          if (
            followingArticle?.classList.contains('topic-article')
            && !source.parentElement.classList.contains('topic-content')
          ) {
            const content = document.createElement('div');
            content.className = 'topic-content';
            source.parentElement.insertBefore(content, source);
            content.append(source, followingArticle);
          }
          const label = source.firstChild;
          if (label?.nodeType === Node.TEXT_NODE) {
            label.textContent = label.textContent.replace('原标题：', '原链接：');
          }
        });

        document.querySelectorAll('.topic-article a[href]').forEach((link) => {
          try {
            const destination = new URL(link.getAttribute('href'), window.location.href);
            if (!['http:', 'https:'].includes(destination.protocol)) return;
            if (destination.origin !== window.location.origin) {
              link.target = '_blank';
              link.rel = 'noopener noreferrer';
            }
          } catch (_) {
            // Invalid links remain inert instead of affecting article rendering.
          }
        });

        const readStorageKey = 'v2ex-report-read-topics-v1';
        let readTopicIds = new Set();
        try {
          const storedIds = JSON.parse(localStorage.getItem(readStorageKey) || '[]');
          if (Array.isArray(storedIds)) readTopicIds = new Set(storedIds.map(String));
        } catch (_) {
          readTopicIds = new Set();
        }

        document.querySelectorAll('.topic-card[data-topic-id]').forEach((card) => {
          const topicId = card.dataset.topicId;
          if (readTopicIds.has(topicId)) card.classList.add('is-read');
          card.addEventListener('toggle', () => {
            if (!card.open || readTopicIds.has(topicId)) return;
            readTopicIds.add(topicId);
            card.classList.add('is-read');
            try {
              localStorage.setItem(readStorageKey, JSON.stringify(Array.from(readTopicIds)));
            } catch (_) {
              // Reading remains available even when browser storage is disabled.
            }
          });
        });
      })();
    </script>
  </body>
</html>
